name: duo-check
# Cloud backup for the Mac watcher. GitHub runs */5 cron on a best-effort basis (often 5-15 min late),
# so each run checks 4 times, 60s apart.
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
concurrency: {group: duo-check, cancel-in-progress: false}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DUO_ZIP: ${{ secrets.DUO_ZIP }}
      DUO_NTFY_TOPIC: ${{ secrets.DUO_NTFY_TOPIC }}
      DUO_STATE: state/duo_watch_state.json
      DUO_LOG: duo_watch.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with: {path: state, key: "duo-state-${{ github.run_id }}", restore-keys: duo-state-}
      - run: |
          mkdir -p state
          for i in 1 2 3 4; do python3 duo_watch.py; if [ $i -lt 4 ]; then sleep 60; fi; done
      - uses: actions/cache/save@v4
        if: always()
        with: {path: state, key: "duo-state-${{ github.run_id }}"}
